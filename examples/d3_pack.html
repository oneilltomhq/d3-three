<!DOCTYPE html>
<html lang="en">
	<head>
		<title>d3-three - circle packing as sphere packing</title>
		<meta charset="utf-8">
		<link rel="icon" href="data:,">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<style>
			body { margin: 0; background: #fff; overflow: hidden; }
			#info { position: absolute; top: 0; width: 100%; text-align: center; color: #555; font: 13px sans-serif; padding: 8px 0; }
		</style>
	</head>
	<body>

		<div id="info">d3-three - d3 circle packing (flare-2.json) lifted to nested sphere packing</div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
					"three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
					"three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
					"d3": "./jsm/vendor/d3.js",
					"d3-three": "../src/d3-three.js",
					"@oneilltom/lib3/sdf-text": "https://cdn.jsdelivr.net/npm/@oneilltom/lib3@0.5.0/dist/sdfText.js"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import * as d3 from 'd3';
			import { register } from 'd3-three';
			import { frameCamera } from '../src/frame.js';
			import { attachOrbit } from '../src/orbit.js';
			import { paddedPack3 } from '../src/pack3.js';
			import { hierarchyLabels } from '../src/labels.js';

			let renderer, scene, camera, labels;

			await init();

			async function init() {

				if ( navigator.gpu ) {

					try {

						const adapter = await navigator.gpu.requestAdapter();
						const info = adapter ? adapter.info : null;

						window.__d3threeAdapterInfo = info ? {
							vendor: info.vendor, architecture: info.architecture,
							device: info.device, description: info.description
						} : null;

					} catch ( e ) {

						window.__d3threeAdapterInfo = { error: String( e ) };

					}

				}

				/* ---------------- data + d3 layout ---------------- */

				const data = await fetch( './data/flare-2.json' ).then( r => r.json() );

				// d3 decides the hierarchy, the value sums and the packing order
				// (descending value), exactly as the notebook's pack() call.
				const root = d3.hierarchy( data )
					.sum( d => d.value )
					.sort( ( a, b ) => b.value - a.value );

				// The 3D packer (src/pack3.js, layouts/pack.md): leaf volume
				// proportional to value, every internal node a sphere enclosing its
				// children. Padding 0.0065 of the unpadded root radius (the
				// notebook's 3 px against a 463 px root); root scaled to R = 10.
				const R = 10;
				paddedPack3( root, { paddingFraction: 0.0065, radius: R } );

				/* ---------------- scene ---------------- */

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0xffffff );

				scene.add( new THREE.HemisphereLight( 0xffffff, 0xbfc4cc, 2.2 ) );

				const sun = new THREE.DirectionalLight( 0xffffff, 1.8 );
				sun.position.set( 1, 2, 1.5 ).normalize();
				scene.add( sun );

				camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 0.1, 4000 );

				/* ---------------- marks: one Object3D per datum ---------------- */

				// Colour by depth: the zoomable circle packing's ramp (pack.v2 itself
				// draws #fff / #ddd, which has no depth to it in 3D).
				const color = d3.scaleLinear()
					.domain( [ 0, 5 ] )
					.range( [ 'hsl(152,80%,80%)', 'hsl(228,30%,40%)' ] )
					.interpolate( d3.interpolateHcl );

				const leafMaterials = new Map();
				const shellMaterials = new Map();

				const materialFor = node => {

					const leaf = ! node.children;
					const pool = leaf ? leafMaterials : shellMaterials;

					if ( ! pool.has( node.depth ) ) {

						const c = new THREE.Color( color( node.depth ) );

						pool.set( node.depth, leaf
							? new THREE.MeshStandardNodeMaterial( { color: c, roughness: 0.6, metalness: 0.0 } )
							: new THREE.MeshStandardNodeMaterial( {
								color: c, roughness: 0.35, metalness: 0.0,
								transparent: true, opacity: 0.25, depthWrite: false, side: THREE.FrontSide
							} ) );

					}

					return pool.get( node.depth );

				};

				// Object3D nesting mirrors the hierarchy: each node's mesh is a child
				// of its parent's mesh and positioned in the parent's local frame
				// (pack3 gives local x/y/z), so world(n) = world(parent) + local(n).
				const nodes = new THREE.Group();
				nodes.name = 'nodes';
				scene.add( nodes );

				const ids = new Map();
				root.each( ( node, i ) => ids.set( node, 'n' + i ) );

				const meshes = new Map();
				const marks = [];
				const leaves = [];

				for ( const node of root.descendants() ) {

					const mesh = new THREE.Mesh( new THREE.SphereGeometry( node.r, 24, 16 ), materialFor( node ) );
					mesh.position.set( node.x, node.y, node.z );
					mesh.name = node.data.name;

					// Translucent shells blend back to front: deeper (inner) shells
					// first, the root's shell last, so an outer shell's front face is
					// composited over everything it contains. Opaque leaves render in
					// the opaque pass before any of this.
					mesh.renderOrder = - node.depth;

					( node.parent ? meshes.get( node.parent ) : nodes ).add( mesh );
					meshes.set( node, mesh );

					marks.push( { id: ids.get( node ), kind: 'node', object: mesh } );
					if ( ! node.children ) leaves.push( mesh );

				}

				/* ---------------- camera + renderer ---------------- */

				// Frame the root sphere: fit the projection of points on its surface
				// (a box fit leaves the corners empty).
				const ringPoints = [];

				for ( let i = 0; i < 12; i ++ ) {

					const phi = Math.PI * ( i + 0.5 ) / 12;

					for ( let j = 0; j < 24; j ++ ) {

						const theta = 2 * Math.PI * j / 24;
						ringPoints.push( new THREE.Vector3(
							R * Math.sin( phi ) * Math.cos( theta ),
							R * Math.cos( phi ),
							R * Math.sin( phi ) * Math.sin( theta )
						) );

					}

				}

				const box = new THREE.Box3( new THREE.Vector3( - R, - R, - R ), new THREE.Vector3( R, R, R ) );

				const target = frameCamera( camera, box, {
					elevation: 20, azimuth: 40, fill: 0.85, points: ringPoints
				} );

				/* ---------------- labels (src/labels.js, rung 3) ----------------
				   The notebook labels a leaf only when the text fits (r > 10 px:
				   147 of 220). The rung 3 labels gate wants one Text member per
				   node (252), so every node gets a member, but only the 147
				   largest leaves carry text; internal shells and smaller leaves
				   carry the empty string (zero glyphs). Orientation is baked once
				   from camera A: every label lies in the plane facing the camera's
				   initial view direction (same quaternion for all; NOT billboarded,
				   the camera can orbit away from it). Each label is centred on its
				   leaf and pushed toward the viewer by the leaf's radius, so it
				   sits on the front of its own sphere and is depth-tested by the
				   leaves in front of it — like the notebook's clip-path, a hidden
				   leaf keeps no visible label. */

				const LABELLED = 147;
				const leafRadii = root.leaves().map( l => l.r ).sort( ( a, b ) => b - a );
				const rMin = leafRadii[ Math.min( LABELLED, leafRadii.length ) - 1 ];

				for ( const node of root.descendants() ) {

					node.data.label = ( ! node.children && node.r >= rMin ) ? node.data.name : '';

				}

				// em = the threshold radius (the notebook's 10 px text in a > 10 px
				// circle), capped at 8 px at the target distance in the 250 px frame.
				const LABEL_PX = 8;
				const pxPerUnit = 250 / ( 2 * camera.position.distanceTo( target ) * Math.tan( camera.fov * Math.PI / 360 ) );
				const fontSize = Math.min( LABEL_PX / pxPerUnit, rMin );

				scene.updateMatrixWorld( true );
				const worldPosition = new Map();
				for ( const [ node, mesh ] of meshes ) worldPosition.set( node, mesh.getWorldPosition( new THREE.Vector3() ) );

				camera.updateMatrixWorld( true );
				const facing = camera.quaternion.clone();                        // baked, see layouts/pack.md
				const toViewer = new THREE.Vector3( 0, 0, 1 ).applyQuaternion( facing );

				labels = await hierarchyLabels( root, ids, worldPosition, {
					font: './fonts/Roboto-Regular.ttf',
					fontSize,
					color: 0x333333,
					outlineWidth: 0.25, outlineColor: 0xffffff,
					orient: () => facing,
					camera,
					billboard: false,
					text: 'label'
				} );

				// Centre every label on its node, on the viewer's side of the sphere.
				for ( const l of labels.labels ) {

					l.object.anchorX = 'center';
					l.anchorX = 'center';
					l.object.position.copy( worldPosition.get( l.node ) ).addScaledVector( toViewer, l.node.r * 1.02 );
					l.object.updateMatrix();

				}

				labels.group.updateMatrixWorld( true );
				labels.batched.sync();
				scene.add( labels.group );

				renderer = new THREE.WebGPURenderer( { antialias: true, alpha: false, forceWebGL: false } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				console.log( 'd3-three backend:', renderer.backend.constructor.name,
					'R(root):', root.r.toFixed( 3 ), 'rMin:', rMin.toFixed( 3 ),
					'fontSize:', fontSize.toFixed( 3 ), 'px:', ( fontSize * pxPerUnit ).toFixed( 2 ),
					'labels:', labels.count, 'with text:', labels.labels.filter( l => l.text ).length,
					'glyphs:', labels.batched.count, 'flipped:', labels.flipped,
					'facing:', facing.toArray().map( v => v.toFixed( 4 ) ).join( ',' ),
					'nodes:', root.descendants().length, 'leaves:', leaves.length );

				const controls = attachOrbit( camera, renderer.domElement, target );
				window.d3threeDev = { camera, controls, labels };

				// pickables = leaf meshes only: the containers are translucent
				// shells, the leaves are the notebook's interactive targets.
				register( {
					renderer, scene, camera, marks, target,
					expected: { nodes: root.descendants().length, links: 0 },
					pickables: leaves,
					labels
				} );

			}

			function animate() {

				labels.update( camera ); // no-op unless billboard: true
				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
