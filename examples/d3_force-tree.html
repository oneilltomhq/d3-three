<!DOCTYPE html>
<html lang="en">
	<head>
		<title>d3-three - force-directed tree in three dimensions</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<style>
			body { margin: 0; background: #fff; overflow: hidden; }
			#info { position: absolute; top: 0; width: 100%; text-align: center; color: #555; font: 13px sans-serif; padding: 8px 0; }
		</style>
	</head>
	<body>

		<div id="info">d3-three - d3 force-directed tree (flare) lifted to d3-force-3d</div>

		<script type="importmap">
			{
				"imports": {
					"three": "/build/three.webgpu.js",
					"three/webgpu": "/build/three.webgpu.js",
					"three/tsl": "/build/three.tsl.js",
					"three/addons/": "/jsm/",
					"d3": "/examples/jsm/vendor/d3.js",
					"d3-three": "/src/d3-three.js",
					"lib3/sdf-text": "/lib3/sdfText.js"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import * as d3 from 'd3';
			import { register } from 'd3-three';
			import { hierarchyNodes } from '/src/nodes.js';
			import { fatLine, lineMaterial } from '/src/link.js';
			import { frameCamera } from '/src/frame.js';
			import { attachOrbit } from '/src/orbit.js';
			import { hierarchyLabels } from '/src/labels.js';
			import { rimColor } from '/src/rim.js';

			let renderer, scene, camera, labels;

			await init();

			async function init() {

				if ( navigator.gpu ) {

					try {

						const adapter = await navigator.gpu.requestAdapter();
						const info = adapter ? adapter.info : null;

						window.__d3threeAdapterInfo = info ? {
							vendor: info.vendor, architecture: info.architecture,
							device: info.device, description: info.description
						} : null;

					} catch ( e ) {

						window.__d3threeAdapterInfo = { error: String( e ) };

					}

				}

				/* ---------------- data + d3 layout (as the notebook's chart cell, in 3D) ---------------- */

				const data = await fetch( '/gallery/hierarchies/force-directed-tree/files/flare-2.json' ).then( r => r.json() );

				// Compute the graph and start the force simulation.
				const root = d3.hierarchy( data );
				const links = root.links();
				const nodes = root.descendants();

				const { position, extent, scale, ticks } = forceLayout( nodes, links );

				/* ---------------- scene ---------------- */

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0xffffff );

				scene.add( new THREE.HemisphereLight( 0xffffff, 0xbfc4cc, 2.2 ) );

				const sun = new THREE.DirectionalLight( 0xffffff, 1.8 );
				sun.position.set( 1, 2, 1.5 ).normalize();
				scene.add( sun );

				camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 0.1, 4000 );

				/* ---------------- marks: one Object3D per datum ---------------- */

				// node marks: one sphere per descendant (src/nodes.js), coloured as
				// the notebook's circles: internal nodes fill #fff (stroke #000),
				// leaves fill #000. The one-colour palette makes every leaf black;
				// the internal colour is white. Same radius for both, as the
				// notebook's r 3.5 (0.2 world units, see layouts/force-tree.md).
				const NODE_R = 0.2;
				const { group: nodeGroup, marks: nodeMarks, ids } = hierarchyNodes( root, position, {
					internalRadius: NODE_R, leafRadius: NODE_R,
					internalColor: 0xffffff, palette: [ '#000000' ]
				} );
				scene.add( nodeGroup );

				// the notebook's `stroke #000` on the white circles: darken the
				// white spheres' silhouette (src/rim.js) — the shared internal
				// material is the one on the root's mesh.
				const internalMaterial = nodeGroup.children[ 0 ].material;
				internalMaterial.colorNode = rimColor( { fill: 0xffffff, stroke: 0x000000 } );

				const marks = nodeMarks.slice();

				// links: one straight fat line per hierarchy link, #999 at opacity
				// 0.6, 1.5 px as the notebook's default stroke-width. One shared material.
				const linkMaterial = lineMaterial( { color: 0x999999, opacity: 0.6, linewidth: 1.5 } );
				const linkGroup = new THREE.Group();
				linkGroup.name = 'links';
				scene.add( linkGroup );

				links.forEach( ( link, i ) => {

					const a = position.get( link.source );
					const b = position.get( link.target );
					const line = fatLine( [ a, b ], { material: linkMaterial } );
					line.name = link.source.data.name + ' - ' + link.target.data.name;
					linkGroup.add( line );

					marks.push( { id: 'l' + i, kind: 'link', object: line, a: ids.get( link.source ), b: ids.get( link.target ) } );

				} );

				/* ---------------- camera ---------------- */

				const nodePoints = nodes.map( n => position.get( n ) );

				const box = new THREE.Box3();
				for ( const p of nodePoints ) box.expandByPoint( p );

				const view = { elevation: 15, azimuth: 35, fill: 0.85 };
				let target = frameCamera( camera, box, { ...view, points: nodePoints } );

				/* ---------------- labels: one Text per INTERNAL node (src/labels.js) ----------------
				   The notebook draws no text (names are <title> tooltips), and all
				   252 names buried the tree, so only the internal nodes — the
				   white hubs, 32 — are labelled; leaves keep their name on
				   mesh.name. Planar, as d3_force: every label lies in the plane
				   facing camera A's initial direction (quaternion copied from the
				   camera once, at layout time), offset +x (camera right) by
				   NODE_R + 0.1, anchor start. Em size capped at LABEL_PX at the
				   target distance and at 0.6 of the closest two internal nodes.
				   The camera is then refitted to the labels' far ends so no name
				   is clipped. */

				const labelled = nodes.filter( d => d.children );
				const labelPoints = labelled.map( n => position.get( n ) );

				const LABEL_PX = 8;
				let pitch = Infinity;
				for ( let i = 0; i < labelled.length; i ++ ) for ( let j = i + 1; j < labelled.length; j ++ ) {

					pitch = Math.min( pitch, labelPoints[ i ].distanceTo( labelPoints[ j ] ) );

				}

				const offset = NODE_R + 0.1;
				let pxPerUnit, fontSize;

				const fit = () => {

					pxPerUnit = 250 / ( 2 * camera.position.distanceTo( target ) * Math.tan( camera.fov * Math.PI / 360 ) );
					fontSize = Math.min( LABEL_PX / pxPerUnit, 0.6 * pitch );

				};

				fit();

				const right = new THREE.Vector3();

				for ( let i = 0; i < 3; i ++ ) {

					// far end of each label: ~0.5 em per glyph of Roboto, along camera right
					right.setFromMatrixColumn( camera.matrixWorld, 0 ).normalize();
					const tips = labelled.map( ( n, k ) => labelPoints[ k ].clone()
						.addScaledVector( right, offset + 0.5 * fontSize * n.data.name.length ) );
					target = frameCamera( camera, box, { ...view, points: nodePoints.concat( tips ) } );
					fit();

				}

				// hierarchyLabels reads `root.descendants()` and `node.children`;
				// give it childless wrappers `{ data }` over the internal nodes
				// only (as d3_force does over its graph), so every label is a
				// "leaf": anchored start, offset outward along +x.
				const wrappers = labelled.map( n => ( { data: n.data } ) );
				const labelIds = new Map( wrappers.map( ( w, i ) => [ w, ids.get( labelled[ i ] ) ] ) );
				const labelPositions = new Map( wrappers.map( ( w, i ) => [ w, labelPoints[ i ] ] ) );
				const facing = camera.quaternion.clone();

				labels = await hierarchyLabels( { descendants: () => wrappers }, labelIds, labelPositions, {
					font: '/examples/fonts/Roboto-Regular.ttf',
					fontSize,
					color: 0x333333,
					outlineWidth: 0.25, outlineColor: 0xffffff,
					leafOffset: offset, internalOffset: offset,
					orient: () => facing,
					camera,
					billboard: false
				} );
				scene.add( labels.group );

				/* ---------------- renderer ---------------- */

				renderer = new THREE.WebGPURenderer( { antialias: true, alpha: false, forceWebGL: false } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				console.log( 'd3-three backend:', renderer.backend.constructor.name,
					'ticks:', ticks, 'scale:', scale.toFixed( 5 ),
					'extent:', extent.map( e => e.toFixed( 3 ) ).join( ' x ' ),
					'pitch:', pitch.toFixed( 3 ), 'fontSize:', fontSize.toFixed( 3 ), 'px:', ( fontSize * pxPerUnit ).toFixed( 2 ),
					'labels:', labels.count, 'of', labelled.length, 'flipped:', labels.flipped,
					'nodes:', nodes.length, 'links:', links.length );

				const controls = attachOrbit( camera, renderer.domElement, target );

				// dev hook (tools/flip.js): orbit by script and count label flips
				window.d3threeDev = { camera, controls, labels };

				register( {
					renderer, scene, camera, marks, target,
					expected: { nodes: root.descendants().length, links: root.links().length, labels: labelled.length },
					pickables: nodeGroup.children,
					labels
				} );

			}

			/* ---------------- the layout (layouts/force-tree.md) ----------------
			   The notebook's forces in three dimensions via d3-force-3d:
			   `forceSimulation(nodes, 3)` with forceLink (distance 0, strength 1),
			   forceManyBody (strength -50), forceX and forceY, plus forceZ for
			   the third axis, at d3's defaults otherwise. Seeded
			   (`randomSource(randomLcg(0.5))`), stopped, and ticked
			   synchronously to convergence — the same number of ticks the
			   simulation would take on its own timer — so the page renders
			   the converged state and never animates. The result is then
			   centred on its bounding box and scaled so the largest axis
			   extent is 20. */

			function forceLayout( nodes, links, { EXTENT = 20 } = {} ) {

				const { forceSimulation, forceLink, forceManyBody, forceX, forceY, forceZ } = d3.force3d;

				const simulation = forceSimulation( nodes, 3 )
					.randomSource( d3.randomLcg( 0.5 ) )
					.force( 'link', forceLink( links ).id( d => d.id ).distance( 0 ).strength( 1 ) )
					.force( 'charge', forceManyBody().strength( - 50 ) )
					.force( 'x', forceX() )
					.force( 'y', forceY() )
					.force( 'z', forceZ() )
					.stop();

				// ticks until alpha < alphaMin, exactly as the timer would do them
				const ticks = Math.ceil( Math.log( simulation.alphaMin() ) / Math.log( 1 - simulation.alphaDecay() ) );
				simulation.tick( ticks );

				const box = new THREE.Box3();
				for ( const n of nodes ) box.expandByPoint( new THREE.Vector3( n.x, n.y, n.z ) );

				const size = box.getSize( new THREE.Vector3() );
				const centre = box.getCenter( new THREE.Vector3() );
				const scale = EXTENT / Math.max( size.x, size.y, size.z );

				const position = new Map();
				for ( const n of nodes ) {

					position.set( n, new THREE.Vector3( n.x, n.y, n.z ).sub( centre ).multiplyScalar( scale ) );

				}

				return { position, ticks, scale, extent: [ size.x * scale, size.y * scale, size.z * scale ] };

			}

			function animate() {

				labels.update( camera ); // per-frame mirror flip (plane fixed); billboard if enabled
				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
