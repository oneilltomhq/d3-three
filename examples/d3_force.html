<!DOCTYPE html>
<html lang="en">
	<head>
		<title>d3-three - force-directed graph in three dimensions</title>
		<meta charset="utf-8">
		<link rel="icon" href="data:,">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<style>
			body { margin: 0; background: #fff; overflow: hidden; }
			#info { position: absolute; top: 0; width: 100%; text-align: center; color: #555; font: 13px sans-serif; padding: 8px 0; }
		</style>
	</head>
	<body>

		<div id="info">d3-three - d3 force-directed graph (Les Misérables) lifted to d3-force-3d</div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
					"three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
					"three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
					"d3": "./jsm/vendor/d3.js",
					"d3-three": "../src/d3-three.js",
					"@oneilltom/lib3/sdf-text": "https://cdn.jsdelivr.net/npm/@oneilltom/lib3@0.5.0/dist/sdfText.js"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import * as d3 from 'd3';
			import { register } from 'd3-three';
			import { fatLine, lineMaterial } from '../src/link.js';
			import { frameCamera } from '../src/frame.js';
			import { attachOrbit } from '../src/orbit.js';
			import { hierarchyLabels } from '../src/labels.js';

			let renderer, scene, camera, labels;

			await init();

			async function init() {

				if ( navigator.gpu ) {

					try {

						const adapter = await navigator.gpu.requestAdapter();
						const info = adapter ? adapter.info : null;

						window.__d3threeAdapterInfo = info ? {
							vendor: info.vendor, architecture: info.architecture,
							device: info.device, description: info.description
						} : null;

					} catch ( e ) {

						window.__d3threeAdapterInfo = { error: String( e ) };

					}

				}

				/* ---------------- data + d3 layout (as the notebook's chart cell, in 3D) ---------------- */

				const data = await fetch( './data/miserables.json' ).then( r => r.json() );

				// Specify the color scale.
				const color = d3.scaleOrdinal( d3.schemeCategory10 );

				// The force simulation mutates links and nodes, so create a copy.
				// Node order and link order as in the file.
				const links = data.links.map( d => ( { ...d } ) );
				const nodes = data.nodes.map( d => ( { ...d } ) );

				const { position, extent, scale, ticks } = forceLayout( nodes, links );

				/* ---------------- scene ---------------- */

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0xffffff );

				scene.add( new THREE.HemisphereLight( 0xffffff, 0xbfc4cc, 2.2 ) );

				const sun = new THREE.DirectionalLight( 0xffffff, 1.8 );
				sun.position.set( 1, 2, 1.5 ).normalize();
				scene.add( sun );

				camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 0.1, 4000 );

				/* ---------------- marks: one Object3D per datum ---------------- */

				// node marks: one sphere per character, coloured by `group` with
				// schemeCategory10 as in the notebook. The notebook's white 1.5 px
				// outline has no one-object counterpart (a second back-face sphere
				// would be two objects per datum); a light emissive lifts the
				// colour off the grey links instead.
				const NODE_R = 0.25;
				const nodeGeometry = new THREE.SphereGeometry( NODE_R, 16, 12 );
				const materials = new Map(); // group -> material

				const nodeGroup = new THREE.Group();
				nodeGroup.name = 'nodes';
				scene.add( nodeGroup );

				const ids = new Map();
				nodes.forEach( ( node, i ) => ids.set( node, 'n' + i ) );

				const marks = [];

				for ( const node of nodes ) {

					if ( ! materials.has( node.group ) ) {

						const c = new THREE.Color( color( node.group ) );
						materials.set( node.group, new THREE.MeshStandardNodeMaterial( {
							color: c, emissive: c, emissiveIntensity: 0.18, roughness: 0.6, metalness: 0
						} ) );

					}

					const mesh = new THREE.Mesh( nodeGeometry, materials.get( node.group ) );
					mesh.position.copy( position.get( node ) );
					mesh.name = node.id;
					nodeGroup.add( mesh );

					marks.push( { id: ids.get( node ), kind: 'node', object: mesh } );

				}

				// links: one straight fat line per co-occurrence, #999 at opacity 0.6,
				// linewidth sqrt(value) px as the notebook's stroke-width. One
				// material per distinct width, shared.
				const linkMaterials = new Map(); // linewidth -> material
				const linkGroup = new THREE.Group();
				linkGroup.name = 'links';
				scene.add( linkGroup );

				for ( const link of links ) {

					const w = Math.sqrt( link.value );

					if ( ! linkMaterials.has( w ) ) {

						linkMaterials.set( w, lineMaterial( { color: 0x999999, opacity: 0.6, linewidth: w } ) );

					}

					const a = position.get( link.source );
					const b = position.get( link.target );
					const line = fatLine( [ a, b ], { material: linkMaterials.get( w ) } );
					line.name = link.source.id + ' - ' + link.target.id;
					linkGroup.add( line );

					marks.push( {
						id: 'l' + ( marks.length - nodes.length ), kind: 'link', object: line,
						a: ids.get( link.source ), b: ids.get( link.target )
					} );

				}

				/* ---------------- camera ---------------- */

				const nodePoints = nodes.map( n => position.get( n ) );

				const box = new THREE.Box3();
				for ( const p of nodePoints ) box.expandByPoint( p );

				const view = { elevation: 15, azimuth: 35, fill: 0.85 };
				let target = frameCamera( camera, box, { ...view, points: nodePoints } );

				/* ---------------- labels: one Text per node (src/labels.js) ----------------
				   Planar: every label lies in the plane facing camera A's initial
				   direction (its quaternion is copied from the camera once, at
				   layout time, not per frame), offset +x (camera right) by
				   NODE_R + 0.1, anchor start. Em size capped at LABEL_PX at the
				   target distance and at 0.6 of the closest two nodes. The camera
				   is then refitted to the labels' far ends so no name is clipped. */

				const LABEL_PX = 8;
				let pitch = Infinity;
				for ( let i = 0; i < nodes.length; i ++ ) for ( let j = i + 1; j < nodes.length; j ++ ) {

					pitch = Math.min( pitch, nodePoints[ i ].distanceTo( nodePoints[ j ] ) );

				}

				const leafOffset = NODE_R + 0.1;
				let pxPerUnit, fontSize;

				const fit = () => {

					pxPerUnit = 250 / ( 2 * camera.position.distanceTo( target ) * Math.tan( camera.fov * Math.PI / 360 ) );
					fontSize = Math.min( LABEL_PX / pxPerUnit, 0.6 * pitch );

				};

				fit();

				const right = new THREE.Vector3();

				for ( let i = 0; i < 3; i ++ ) {

					// far end of each label: ~0.5 em per glyph of Roboto, along camera right
					right.setFromMatrixColumn( camera.matrixWorld, 0 ).normalize();
					const tips = nodes.map( n => position.get( n ).clone()
						.addScaledVector( right, leafOffset + 0.5 * fontSize * n.id.length ) );
					target = frameCamera( camera, box, { ...view, points: nodePoints.concat( tips ) } );
					fit();

				}

				// hierarchyLabels wants a d3 hierarchy; a graph has none. Give it
				// the one thing it reads — `root.descendants()` — as a flat list
				// of childless wrappers `{ data: node }`, so every label is a
				// "leaf": anchored start, offset outward along +x.
				const wrappers = nodes.map( n => ( { data: n } ) );
				const labelIds = new Map( wrappers.map( ( w, i ) => [ w, ids.get( nodes[ i ] ) ] ) );
				const labelPositions = new Map( wrappers.map( ( w, i ) => [ w, nodePoints[ i ] ] ) );
				const facing = camera.quaternion.clone();

				labels = await hierarchyLabels( { descendants: () => wrappers }, labelIds, labelPositions, {
					font: './fonts/Roboto-Regular.ttf',
					fontSize,
					color: 0x333333,
					outlineWidth: 0.25, outlineColor: 0xffffff,
					leafOffset, internalOffset: leafOffset,
					orient: () => facing,
					camera,
					billboard: false,
					text: 'id'
				} );
				scene.add( labels.group );

				/* ---------------- renderer ---------------- */

				renderer = new THREE.WebGPURenderer( { antialias: true, alpha: false, forceWebGL: false } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				console.log( 'd3-three backend:', renderer.backend.constructor.name,
					'ticks:', ticks, 'scale:', scale.toFixed( 5 ),
					'extent:', extent.map( e => e.toFixed( 3 ) ).join( ' x ' ),
					'pitch:', pitch.toFixed( 3 ), 'fontSize:', fontSize.toFixed( 3 ), 'px:', ( fontSize * pxPerUnit ).toFixed( 2 ),
					'labels:', labels.count, 'flipped:', labels.flipped,
					'nodes:', nodes.length, 'links:', links.length );

				const controls = attachOrbit( camera, renderer.domElement, target );

				// dev hook (tools/flip.js): orbit by script and count label flips
				window.d3threeDev = { camera, controls, labels };

				register( {
					renderer, scene, camera, marks, target,
					expected: { nodes: data.nodes.length, links: data.links.length },
					pickables: nodeGroup.children,
					labels
				} );

			}

			/* ---------------- the layout (layouts/force.md) ----------------
			   The notebook's three forces in three dimensions via d3-force-3d:
			   `forceSimulation(nodes, 3)` with forceLink, forceManyBody and a
			   3-argument forceCenter, all at d3's defaults. Seeded
			   (`randomSource(randomLcg(0.5))`), stopped, and ticked
			   synchronously to convergence — the same number of ticks the
			   simulation would take on its own timer — so the page renders
			   the converged state and never animates. The result is then
			   centred on its bounding box and scaled so the largest axis
			   extent is 20. */

			function forceLayout( nodes, links, { EXTENT = 20 } = {} ) {

				const { forceSimulation, forceLink, forceManyBody, forceCenter } = d3.force3d;

				const simulation = forceSimulation( nodes, 3 )
					.randomSource( d3.randomLcg( 0.5 ) )
					.force( 'link', forceLink( links ).id( d => d.id ) )
					.force( 'charge', forceManyBody() )
					.force( 'center', forceCenter( 0, 0, 0 ) )
					.stop();

				// ticks until alpha < alphaMin, exactly as the timer would do them
				const ticks = Math.ceil( Math.log( simulation.alphaMin() ) / Math.log( 1 - simulation.alphaDecay() ) );
				simulation.tick( ticks );

				const box = new THREE.Box3();
				for ( const n of nodes ) box.expandByPoint( new THREE.Vector3( n.x, n.y, n.z ) );

				const size = box.getSize( new THREE.Vector3() );
				const centre = box.getCenter( new THREE.Vector3() );
				const scale = EXTENT / Math.max( size.x, size.y, size.z );

				const position = new Map();
				for ( const n of nodes ) {

					position.set( n, new THREE.Vector3( n.x, n.y, n.z ).sub( centre ).multiplyScalar( scale ) );

				}

				return { position, ticks, scale, extent: [ size.x * scale, size.y * scale, size.z * scale ] };

			}

			function animate() {

				labels.update( camera ); // per-frame mirror flip (plane fixed); billboard if enabled
				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
