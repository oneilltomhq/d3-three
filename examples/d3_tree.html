<!DOCTYPE html>
<html lang="en">
	<head>
		<title>d33 - tidy tree as a radial fan of tidy planes</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<style>
			body { margin: 0; background: #fff; overflow: hidden; }
			#info { position: absolute; top: 0; width: 100%; text-align: center; color: #555; font: 13px sans-serif; padding: 8px 0; }
		</style>
	</head>
	<body>

		<div id="info">d33 - d3 tidy tree (flare.json) lifted to a radial fan of tidy planes</div>

		<script type="importmap">
			{
				"imports": {
					"three": "/build/three.webgpu.js",
					"three/webgpu": "/build/three.webgpu.js",
					"three/tsl": "/build/three.tsl.js",
					"three/addons/": "/jsm/",
					"d3": "/examples/jsm/vendor/d3.js",
					"d33": "/src/d33.js"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import * as d3 from 'd3';
			import { register } from 'd33';
			import { linkCurve, fatLine, lineMaterial } from '/src/link.js';
			import { frameCamera } from '/src/frame.js';
			import { attachOrbit } from '/src/orbit.js';
			import { hierarchyNodes } from '/src/nodes.js';

			let renderer, scene, camera;

			await init();

			async function init() {

				if ( navigator.gpu ) {

					try {

						const adapter = await navigator.gpu.requestAdapter();
						const info = adapter ? adapter.info : null;

						window.__d33AdapterInfo = info ? {
							vendor: info.vendor, architecture: info.architecture,
							device: info.device, description: info.description
						} : null;

					} catch ( e ) {

						window.__d33AdapterInfo = { error: String( e ) };

					}

				}

				/* ---------------- data + d3 layout ---------------- */

				const data = await fetch( '/gallery/hierarchies/tree.v2/files/flare.json' ).then( r => r.json() );

				const root = d3.hierarchy( data );
				root.sort( ( a, b ) => d3.ascending( a.data.name, b.data.name ) );

				const { position, axis, B, dy } = fanLayout( root );

				/* ---------------- scene ---------------- */

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0xffffff );

				scene.add( new THREE.HemisphereLight( 0xffffff, 0xbfc4cc, 2.2 ) );

				const sun = new THREE.DirectionalLight( 0xffffff, 1.8 );
				sun.position.set( 1, 2, 1.5 ).normalize();
				scene.add( sun );

				camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 0.1, 4000 );

				/* ---------------- marks: one Object3D per datum ---------------- */

				// node marks: one Mesh per descendant, internal #555 and leaves
				// coloured by top-level package (src/nodes.js, shared with d3_cluster).
				const { group: nodes, marks: nodeMarks, ids } = hierarchyNodes( root, position );
				scene.add( nodes );

				const marks = [ ...nodeMarks ];

				// links: one fat line per root.links(), a cubic bezier whose control
				// points are offset along the blade's radial axis — the 3D
				// linkHorizontal, depth running outward from the spine.
				const linkMaterial = lineMaterial( { color: 0x555555, opacity: 0.4, linewidth: 1.5 } );

				const links = new THREE.Group();
				links.name = 'links';
				scene.add( links );

				for ( const link of root.links() ) {

					// the ten root->child links use their own child's radial vector
					const radial = axis.get( link.target );
					const points = linkCurve( position.get( link.source ), position.get( link.target ), radial, 16 );
					const line = fatLine( points, { material: linkMaterial } );
					links.add( line );

					marks.push( {
						id: 'l' + marks.length, kind: 'link', object: line,
						a: ids.get( link.source ), b: ids.get( link.target )
					} );

				}

				/* ---------------- camera + renderer ---------------- */

				const nodePoints = marks.filter( m => m.kind === 'node' ).map( m => m.object.position );

				const box = new THREE.Box3();
				for ( const p of nodePoints ) box.expandByPoint( p );

				// Blades sit at multiples of 36 degrees and camera B is camera A
				// rotated 90 degrees, so azimuth 9 (mod 36) keeps both cameras
				// 9 degrees off any edge-on blade.
				const target = frameCamera( camera, box, {
					elevation: 30, azimuth: 9, fill: 0.85, points: nodePoints
				} );

				renderer = new THREE.WebGPURenderer( { antialias: true, alpha: false, forceWebGL: false } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				console.log( 'd33 backend:', renderer.backend.constructor.name,
					'B:', B.toFixed( 3 ), 'dy:', dy.toFixed( 3 ),
					'nodes:', root.descendants().length, 'links:', root.links().length );

				attachOrbit( camera, renderer.domElement, target );

				register( {
					renderer, scene, camera, marks, target,
					expected: { nodes: root.descendants().length, links: root.links().length },
					pickables: nodes.children
				} );

			}

			/* ---------------- the fan of tidy planes (layouts/tree.md) ----------
			   d3.tree's Reingold-Tilford layout is compositional: a subtree's
			   shape does not depend on its siblings, only on the shift applied
			   to it. So the tidy layout is kept verbatim and each top-level
			   subtree becomes its own vertical plane ("blade"), the k blades
			   fanned around the root like pages around a spine. Depth (node.y)
			   runs radially outward; breadth (node.x) runs vertically inside a
			   blade, recentred on its own top-level child so every blade hangs
			   off the root's height. */

			function fanLayout( root ) {

				// Pass 1: unit breadth, to measure the blades. node.x does not
				// depend on the depth spacing, so this measurement is exact.
				d3.tree().nodeSize( [ 1, 1 ] )( root );

				let B = 0;

				for ( const child of root.children ) {

					let lo = Infinity, hi = - Infinity;
					child.each( n => {

						if ( n.x < lo ) lo = n.x;
						if ( n.x > hi ) hi = n.x;

					} );

					B = Math.max( B, hi - lo );

				}

				// Pass 2: depth spacing dy = B / 5, so the fan is about as deep
				// (root.height * dy) as the tallest blade is tall.
				const dy = B / 5;

				d3.tree().nodeSize( [ 1, dy ] )( root );

				const k = root.children.length;

				const position = new Map();
				const axis = new Map();

				position.set( root, new THREE.Vector3( 0, 0, 0 ) );

				root.children.forEach( ( child, i ) => {

					const theta = 2 * Math.PI * i / k;
					const radial = new THREE.Vector3( Math.cos( theta ), 0, Math.sin( theta ) );
					const x0 = child.x; // centre the blade on the root's height

					child.each( node => {

						position.set( node, new THREE.Vector3(
							node.y * radial.x,
							node.x - x0,
							node.y * radial.z
						) );

						axis.set( node, radial );

					} );

				} );

				return { position, axis, B, dy };

			}

			function animate() {

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
